spring.application.name=lifeos-backend

# Database
# Local defaults below. In production set SPRING_DATASOURCE_URL, _USERNAME and
# _PASSWORD as environment variables; Spring uses them instead of these values.
# Neon: jdbc:postgresql://<host>/<db>?sslmode=require (use the direct host, not -pooler)
spring.datasource.url=jdbc:postgresql://localhost:5432/lifeos_db
spring.datasource.username=postgres
spring.datasource.password=lifeos123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool, sized for one small instance and a serverless Postgres (Neon).
#  - small pool: Neon's free compute and a 512 MB container don't need more
#  - minimum-idle=0 + idle-timeout: release connections when nobody is using the
#    app so the database can scale to zero and save free compute hours
#  - max-lifetime below Neon's 5 minute suspend so connections are retired before
#    Neon closes them; Hikari validates every connection before handing it out
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=15000

# JPA
spring.jpa.hibernate.ddl-auto=update
# SQL logging off in production (noisy, slows the app, fills logs)
spring.jpa.show-sql=false

# Server
# Hosting platforms (Render, Heroku, Cloud Run) inject PORT; 8080 locally.
server.port=${PORT:8080}
# Finish in-flight requests on deploy/restart instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Fewer threads keep memory low on a small instance; plenty for current traffic.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}

# JWT signing key: provided via the JWT_SECRET environment variable (never commit it).
# ---------------------------------------------------------------------------
# Resend email API (https://resend.com)
# ---------------------------------------------------------------------------
# NEVER hardcode the real key here. Set the RESEND_API_KEY environment variable
# on your machine (Windows: System Properties > Environment Variables) and
# Spring Boot will inject it automatically at startup.
#
# Local dev:  set RESEND_API_KEY=re_yourkey  in Windows Environment Variables
# Production: set RESEND_API_KEY in your cloud platform's secret manager
# ---------------------------------------------------------------------------
resend.api.key=${RESEND_API_KEY}
