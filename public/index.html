<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- VIEWPORT - Critical for all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1, viewport-fit=cover" />

    <!-- PWA META TAGS -->
    <meta name="theme-color" content="#5B4FD4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="LifeOS" />

    <!-- iOS SPECIFIC -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- iPad specific -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ANDROID SPECIFIC -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <meta name="description" content="LifeOS Health — Track nutrition, exercise, weight and get AI coaching. Your personal health intelligence." />
    <meta name="keywords" content="nutrition tracker, calorie counter, health app, fitness tracker, AI coach" />
    <meta name="author" content="AJ Rayamajhi" />

    <!-- OPEN GRAPH (for sharing) -->
    <meta property="og:title" content="LifeOS Health" />
    <meta property="og:description" content="Your personal nutrition intelligence. Track food, exercise, weight and get AI coaching." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- MANIFEST -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>LifeOS Health</title>

    <style>
      /* PREVENT FLASH OF UNSTYLED CONTENT */
      html { background-color: #F5F5F8; }
      body { margin: 0; padding: 0; }

      /* iOS SAFE AREA SUPPORT */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* PREVENT DOUBLE TAP ZOOM ON iOS */
      * { touch-action: manipulation; }

      /* LOADING SCREEN */
      #loading {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #F5F5F8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #loading .logo { font-size: 48px; margin-bottom: 16px; }
      #loading .name { font-size: 24px; font-weight: 700; color: #5B4FD4; letter-spacing: -0.5px; }
      #loading .sub { font-size: 13px; color: #9898AA; margin-top: 6px; }
      #loading .spinner {
        width: 28px; height: 28px;
        border: 3px solid rgba(91,79,212,.2);
        border-top-color: #5B4FD4;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 24px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run LifeOS Health.</noscript>

    <!-- LOADING SCREEN -->
    <div id="loading">
      <div class="logo">💪</div>
      <div class="name">LifeOS</div>
      <div class="sub">Your personal health intelligence</div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script>
      // Hide loading screen when React loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease';
            setTimeout(function() { loading.style.display = 'none'; }, 300);
          }
        }, 800);
      });
    </script>
  </body>
</html>
